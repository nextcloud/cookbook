version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
    time: "03:00"
    timezone: Europe/Paris
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
  ignore:
    - dependency-name: "eslint"
      versions:
      - "10.x"
- package-ecosystem: composer
  directory: "/"
  schedule:
    interval: daily
    time: "03:00"
    timezone: Europe/Paris
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
- package-ecosystem: bundler
  directory: "/docs"
  schedule:
    timezone: Europe/Berlin
    interval: daily
    time: "02:50"
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    timezone: Europe/Berlin
    interval: daily
    time: "02:50"
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7

