name: Build images nightly for unit testing
on:
    workflow_dispatch:
    schedule:
        - cron: "30 2 * * *"

jobs:
    push:
        name: Build and push the latest test images
        runs-on: ubuntu-latest
        environment: docker-pushing
        permissions:
          contents: read
          packages: write
        
        strategy:
            fail-fast: false
            matrix:
                phpVersion:
                    - "8.3"
                    - "8.4"
                    - "8.5"
                    # - "8"
        steps:
            - name: Check if secret is known
              shell: bash
              id: check
              run: |
                echo "docker_hub_skip=false" >> $GITHUB_OUTPUT
                echo "ghcr_skip=true" >> $GITHUB_OUTPUT
                echo "skip_all=true" >> $GITHUB_OUTPUT
                if [ -z "${{ secrets.DOCKER_HUB_TOKEN }}" ]; then
                    echo "docker_hub_skip=true" >> $GITHUB_OUTPUT
                fi
                if [ -z "${{ vars.DOCKER_HUB_USERNAME }}" ]; then
                    echo "docker_hub_skip=true" >> $GITHUB_OUTPUT
                fi
                if [ "$GITHUB_REPOSITORY" = "nextcloud/cookbook" ]; then
                  echo "ghcr_skip=false" >> $GITHUB_OUTPUT
                fi
                if [ -n "${{ secrets.DOCKER_HUB_TOKEN }}" ] && [ -n "${{ vars.DOCKER_HUB_USERNAME }}" ] || [ "$GITHUB_REPOSITORY" = "nextcloud/cookbook" ]; then
                  echo "skip_all=false" >> $GITHUB_OUTPUT
                fi
            
            - name: Checkout the app
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              if: ${{ steps.check.outputs.skip_all == 'false' }}
              with:
                persist-credentials: false
              
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
            - name: Log into Docker Hub
              shell: bash
              run: >-
                echo "${{ secrets.DOCKER_HUB_TOKEN }}" 
                | docker login 
                --username ${{ vars.DOCKER_HUB_USERNAME }}
                --password-stdin
              if: ${{ steps.check.outputs.docker_hub_skip == 'false' }}
            - name: Log into GitHub Container Registry
              shell: bash
              run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
              if: ${{ steps.check.outputs.ghcr_skip == 'false' }}

            - name: Install dependencies for runner
              shell: bash
              run: >-
                cd .github/actions/run-tests &&
                pip install -r requirements.txt
              if: ${{ steps.check.outputs.skip_all == 'false' }}

            - name: Build and push images to Docker Hub
              id: push_docker_hub
              shell: bash
              run: >-
                cd .github/actions/run-tests &&
                docker buildx bake --pull --push 
                --var PHPVERSION=${{ matrix.phpVersion }} 
                --var REGISTRY=dockerhub
                -f docker-compose.yml
                -f docker-bake.hcl
                --progress plain
                dut mysql postgres
              continue-on-error: true
              if: ${{ steps.check.outputs.docker_hub_skip == 'false' }}

            - name: Build and push images to GitHub Container Registry
              id: push_ghcr
              shell: bash
              run: >-
                cd .github/actions/run-tests &&
                docker buildx bake --pull --push 
                --var PHPVERSION=${{ matrix.phpVersion }} 
                --var REGISTRY=ghcr
                -f docker-compose.yml
                -f docker-bake.hcl
                --progress plain
                dut mysql postgres
              continue-on-error: true
              if: ${{ steps.check.outputs.ghcr_skip == 'false' }}

            - name: Check image publishing results
              if: ${{ always() && steps.check.outputs.skip_all == 'false' }}
              env:
                DOCKER_HUB_PUSH_OUTCOME: ${{ steps.push_docker_hub.outcome }}
                GHCR_PUSH_OUTCOME: ${{ steps.push_ghcr.outcome }}
              shell: bash
              run: |
                if [[ "$DOCKER_HUB_PUSH_OUTCOME" == "failure" || "$GHCR_PUSH_OUTCOME" == "failure" ]]; then
                    echo "One or more container image tagging or publishing steps failed."
                    exit 1
                fi

            - name: Clean up GitHub Container Registry
              uses: dataaxiom/ghcr-cleanup-action@v1
              with:
                packages: testci,postgres-test,mariadb-test
