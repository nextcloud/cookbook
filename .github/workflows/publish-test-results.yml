name: Annotate test results 

on:
  workflow_run:
    workflows:
      - "CI"
    types:
      - completed

jobs:
  test-results:
    runs-on: ubuntu-latest-low
    name: Test results
    if: >-
      github.event.workflow_run.conclusion != 'skipped' &&
      github.event.workflow_run.event == 'pull_request'

    steps:
      # - name: Debug output
      #   env:
      #     EVENT: ${{ toJSON(github.event) }}
      #   run: |
      #     echo "$EVENT"

      - name: Download and Extract Artifacts
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          GITHUB_EVENT_WORKFLOW_RUN_ARTIFACTS_URL: ${{ github.event.workflow_run.artifacts_url }}
        run: |
           mkdir -p artifacts && cd artifacts

           artifacts_url=${GITHUB_EVENT_WORKFLOW_RUN_ARTIFACTS_URL}

           gh api "$artifacts_url" -q '.artifacts[] | [.name, .archive_download_url] | @tsv' | while read artifact
           do
             IFS=$'\t' read name url <<< "$artifact"
             gh api $url > "$name.zip"
             unzip -d "$name" "$name.zip"
           done

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/Event File/event.json
          event_name: ${{ github.event.workflow_run.event }}
          files: "artifacts/Junit test log files*/*.xml"

