name: Annotate test results

on:
  workflow_run:
    workflows:
      - "CI"
    types:
      - completed

jobs:
  test-results:
    runs-on: ubuntu-latest-low
    name: Test results
    environment:
      name: codecov
      url: https://codecov.io/gh/nextcloud/cookbook
    if: >-
      github.event.workflow_run.conclusion != 'skipped' &&
      github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Download and Extract Artifacts
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          GITHUB_EVENT_WORKFLOW_RUN_ARTIFACTS_URL: ${{ github.event.workflow_run.artifacts_url }}
        run: |
           mkdir -p artifacts && cd artifacts

           artifacts_url=${GITHUB_EVENT_WORKFLOW_RUN_ARTIFACTS_URL}

           gh api "$artifacts_url" -q '.artifacts[] | [.name, .archive_download_url] | @tsv' | while read artifact
           do
             IFS=$'\t' read name url <<< "$artifact"
             gh api $url > "$name.zip"
             unzip -d "$name" "$name.zip"
           done

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/Event File/event.json
          event_name: ${{ github.event.workflow_run.event }}
          files: "artifacts/Junit test log files*/*.xml"

      - name: Create coverage folder structure
        run: mkdir -p unit-coverage integration-coverage migration-coverage

      - name: Copy Coverage reports to separate folders
        run: |
          cd artifacts

          for i in Code*
          do
            if [ -f "$i/coverage.unit.xml" ]; then
              mkdir -p "../unit-coverage/$i"
              cp "$i/coverage.unit.xml" "../unit-coverage/$i/coverage.xml"
            fi
            if [ -f "$i/coverage.integration.xml" ]; then
              mkdir -p "../integration-coverage/$i"
              cp "$i/coverage.integration.xml" "../integration-coverage/$i/coverage.xml"
            fi
            if [ -f "$i/coverage.migration.xml" ]; then
              mkdir -p "../migration-coverage/$i"
              cp "$i/coverage.migration.xml" "../migration-coverage/$i/coverage.xml"
            fi
          done
      - name: Show file structure
        run: ls -lR *-coverage

      - name: Upload unit test codecov reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          flags: unittests
          directory: unit-coverage
          override_commit: ${{ github.event.workflow_run.head_sha }}
          verbose: true
      - name: Upload integration test codecov reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          flags: integration
          directory: integration-coverage
          override_commit: ${{ github.event.workflow_run.head_sha }}
          verbose: true
      - name: Upload migration test codecov reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          flags: migration
          directory: migration-coverage
          override_commit: ${{ github.event.workflow_run.head_sha }}
          verbose: true
