name: Plumber

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.plumber.yaml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.plumber.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plumber:
    name: Check the workflow files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Plumber reads the workflow runs and one run log to tell which
      # scopes the token of each job has
      actions: read
      # Lists the findings under code scanning
      security-events: write

    steps:
      - name: Checkout the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Plumber
        uses: getplumber/plumber@ec8cb3a7edd6a324b33e85109b627b2df6023d94 # v0.7.23
        with:
          # Pull requests from forks get no security-events write, so the
          # upload is skipped there and the report stays a workflow artifact
          upload-sarif: ${{ github.event.pull_request.head.repo.fork != true }}
          # Fail under 85 points instead of on any finding, so one small
          # finding does not block a pull request
          min-points: 85
