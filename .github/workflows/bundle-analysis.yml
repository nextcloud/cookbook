name: Bundle analysis

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}

jobs:
  upload-bundle-stats:
    name: Upload bundle stats to Codecov
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read package.json node and npm engines version
        uses: skjnldsv/read-package-engines-version-actions@06d6db44aa62f4609ba070f556ec24bc99fb85cb # v4
        id: versions

      - name: Set up node ${{ steps.versions.outputs.nodeVersion }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.nodeVersion }}

      - name: Set up npm ${{ steps.versions.outputs.npmVersion }}
        run: npm i -g --ignore-scripts 'npm@${{ steps.versions.outputs.npmVersion }}'

      - name: Install the NPM dependencies
        run: npm ci --ignore-scripts

      - name: Build and upload bundle stats
        run: npm run build
