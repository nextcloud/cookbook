name: Slack-like comments
on:
  issue_comment:
    types:
      - "created"
      - "edited"

defaults:
  run:
    shell: bash

jobs:
  approve-pr:
    name: Approve PR
    runs-on: ubuntu-latest-low
    if: github.event.issue.pull_request
    environment: change-approval
    # The approval is made with the App token, never with the job token
    permissions: {}
    env:
      admins: '["seyfeb", "christianlupus"]'
    steps:
      - name: Check if user is admin and comment is /approve
        id: checker
        env:
          IS_ADMIN: ${{ contains(fromJSON(env.admins), github.event.sender.login) }}
          IS_APPROVE: ${{ github.event.comment.body == '/approve' }}
          RUN_APPROVE: ${{ contains(fromJSON(env.admins), github.event.sender.login) && github.event.comment.body == '/approve' }}
        run: |-
          echo "is_admin=$IS_ADMIN" >> "$GITHUB_OUTPUT"
          echo "is_approve=$IS_APPROVE" >> "$GITHUB_OUTPUT"
          echo "run_approve=$RUN_APPROVE" >> "$GITHUB_OUTPUT"

      - run: |-
            echo "Admins: $admins"
            echo "User is permitted: ${{ steps.checker.outputs.is_admin }}"
            echo "Comment body matches /approve: ${{ steps.checker.outputs.is_approve }}"
            echo "Run approve: ${{ steps.checker.outputs.run_approve }}"

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        if: steps.checker.outputs.run_approve == 'true'
        with:
          client-id: ${{ vars.COOKBOOK_PR_APPROVE_CLIENT_ID }}
          private-key: ${{ secrets.COOKBOOK_PR_APPROVE_PRIV_KEY }}
          owner: nextcloud
          repositories: cookbook
          permission-pull-requests: write
      - uses: hmarr/auto-approve-action@f0939ea97e9205ef24d872e76833fa908a770363 # v4.0.0
        if: steps.checker.outputs.run_approve == 'true'
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          pull-request-number: ${{ github.event.issue.number }}
          review-message: "Automatically approved by GitHub action on behalf of `/approve`"


